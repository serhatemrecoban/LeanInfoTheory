<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="leaninfotheory-release" content="$version">
  <title>$title | LeanInfoTheory $version Blueprint</title>
  <link rel="canonical" href="$canonical">
  <link rel="stylesheet" href="${base}blueprint.css">
  <script src="${base}blueprint.js" defer></script>
</head>
<body data-base="$base" data-page="$state">
  <a class="skip" href="#content">Skip to content</a>
  <header class="masthead">
    <div class="bar">
      <a class="brand" href="${base}index.html">LeanInfoTheory <span>Blueprint</span></a>
      <a class="edition" href="$edition" aria-label="Permanent link to the $version edition">$version</a>
      <nav class="project" aria-label="Project resources"><a href="$home">Home</a><a href="${home}docs/">Docs</a><a href="$api">Lean API</a><a href="${base}blueprint.pdf">PDF</a></nav>
    </div>
    <div class="search-band"><form class="search" role="search" action="${base}search.html">
      <label for="query">Search the blueprint</label>
      <input id="query" name="q" type="search" autocomplete="off" placeholder="Theorem, definition, or Lean name">
      <button type="submit">Search</button>
      <div id="suggestions" hidden></div>
    </form></div>
  </header>
  <div class="layout">
    $tree
    <main id="content">$main</main>
$toc
  </div>
  <footer class="foot"><a href="${base}index.html">Blueprint contents</a><a href="${home}blueprint/dep_graph_document.html">Module import map</a><a href="${home}license.html">License and citation</a></footer>
</body>
</html>

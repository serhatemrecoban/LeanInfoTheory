name: Verify the qualified LeanInfoTheory v0.3.0 Pages archives

on:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Retrieve and verify both archives at their permanent revision
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUNDLES_REVISION: "9f3024400d2028bb9d2aa016f9ce9b7678012026"
        run: |
          set -euo pipefail
          case "$GITHUB_REPOSITORY" in
            serhatemrecoban/LeanInfoTheory-API-v0.3.0)
              test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ;;
            serhatemrecoban/LeanInfoTheory)
              test "$GITHUB_REF" = "refs/heads/codex/v0.3.0-bundle-verification" ;;
            *) exit 1 ;;
          esac
          cat > "$RUNNER_TEMP/qualification.json" <<'PINS'
          {
            "archives": {
              "api": {
                "file_manifest_sha256": "e51e5c276d913e021d7f2717fac9c60175b583b447b7d20757abbe13acade12e",
                "tar_bytes": 667535360,
                "tar_sha256": "69279c72f8515ad9cab442fc5a00328ff8004eedb409f1b594cd237144b416b8",
                "zip_bytes": 29636236,
                "zip_sha256": "b1ffa823b99baf65c73c5cdba14c1efd572e166a7d9819ac1ef06857b9cdf96d"
              },
              "main": {
                "file_manifest_sha256": "0d5454fd2f6466a69b65ee2fab6310119377ddbe2662d493628015d6a474b747",
                "tar_bytes": 666081280,
                "tar_sha256": "a035fd367a68b89aca7418e71f301dcd7ca59a83367422e99bd2e5f518a2e05e",
                "zip_bytes": 29662815,
                "zip_sha256": "fb98b734ac4c26a12fab0d9768ba0f6348b146cca49f08a816fc189571aa9e30"
              }
            },
            "receipt_sha256": "69428e89e2c4b549075a549db1bc6787e161d3324a6d715914f08eb2052647af",
            "source": "d12af2d34d49ee493f55c8924cebff815b2953be",
            "source_tree": "255afd15f8935a73e62bbaecadff6e7c2ed93399"
          }
          PINS
          cat > "$RUNNER_TEMP/check_bundles.py" <<'PYTHON'
          """Verify public Pages bundles from the pinned archive repository, before release promotion."""
          from __future__ import annotations

          import argparse
          from hashlib import file_digest, sha256
          import json
          from pathlib import Path, PurePosixPath
          import re
          import shutil
          import tarfile
          import tempfile
          from urllib.request import Request, urlopen
          from zipfile import ZIP_DEFLATED, ZipFile


          REPOSITORY = "serhatemrecoban/LeanInfoTheory-API-v0.3.0"
          VERSION = "v0.3.0"
          SOURCE = "d12af2d34d49ee493f55c8924cebff815b2953be"
          SOURCE_TREE = "255afd15f8935a73e62bbaecadff6e7c2ed93399"
          HISTORICAL = {"files": 5569, "bytes": 662452623, "sha256": "bd7c79fe8d0404faa656ca63e8f352c2fa1c207d6091cd3e032a8ad9798b0b87"}
          SITES = {"main": "LeanInfoTheory", "api": REPOSITORY.split("/")[1]}


          def require(condition: bool, issue: str) -> None:
              if not condition:
                  raise ValueError(issue)


          def binary_digest(p: Path) -> str:
              with p.open("rb") as f:
                  return file_digest(f, "sha256").hexdigest()


          def fetch(root: Path, file: str, revision: str, local: Path | None) -> Path:
              destination = root / file
              if local is None:
                  url = f"https://raw.githubusercontent.com/{REPOSITORY}/{revision}/packages/{VERSION}/{file}"
                  request = Request(url, headers={"User-Agent": "LeanInfoTheory-Pages-bundle-verification"})
                  inp = urlopen(request, timeout=90)
              else:
                  inp = (local / file).open("rb")
              with inp, destination.open("xb") as output:
                  shutil.copyfileobj(inp, output, 1 << 20)
              return destination


          def verify_site(label: str, site: str, pins: dict, expected: dict, folder: Path,
                          revision: str, local: Path | None) -> dict:
              manifest_file = fetch(folder, label + "-files.json", revision, local)
              require(binary_digest(manifest_file) == pins["file_manifest_sha256"], f"{label}: manifest digest")
              manifest = json.loads(manifest_file.read_bytes())
              require(manifest["schema"] == "lean-info-theory.pages-file-manifest.v1"
                      and manifest["source"] == SOURCE and manifest["purpose"] == "candidate"
                      and manifest["site"] == site and manifest["tree_sha256"] == expected["sha256"]
                      and manifest["tar_sha256"] == pins["tar_sha256"], f"{label}: manifest identity")
              bundle = fetch(folder, label + ".zip", revision, local)
              require(bundle.stat().st_size == pins["zip_bytes"] and binary_digest(bundle) == pins["zip_sha256"],
                      f"{label}: ZIP identity")
              ordered, total, tree = [], 0, sha256()
              with ZipFile(bundle) as z:
                  require(z.namelist() == ["artifact.tar"] and z.getinfo("artifact.tar").compress_type == ZIP_DEFLATED,
                          f"{label}: unexpected wrapper")
                  require(z.getinfo("artifact.tar").file_size == pins["tar_bytes"], f"{label}: TAR size")
                  with z.open("artifact.tar") as raw:
                      require(file_digest(raw, "sha256").hexdigest() == pins["tar_sha256"], f"{label}: TAR digest")
                  with z.open("artifact.tar") as raw, tarfile.open(fileobj=raw, mode="r|") as tar:
                      for member in tar:
                          path = member.name.removeprefix("./")
                          parts = path.split("/")
                          require(member.isfile() and member.name == "./" + path and not PurePosixPath(path).is_absolute()
                                  and "\\" not in path and not any(p in ("", ".", "..") for p in parts)
                                  and path in manifest["files"], f"{label}: unsafe or unlisted TAR member")
                          per_file = manifest["files"][path]
                          require(member.size == per_file["bytes"] and member.size <= 100 << 20, f"{label}: file size")
                          tree.update(path.encode() + b"\0")
                          digest = sha256()
                          with tar.extractfile(member) as entry:
                              while block := entry.read(1 << 20):
                                  digest.update(block)
                                  tree.update(block)
                          require(digest.hexdigest() == per_file["sha256"], f"{label}: incorrect bytes for {path}")
                          tree.update(b"\0")
                          ordered.append(path)
                          total += member.size
              require(ordered == sorted(manifest["files"]), f"{label}: duplicate or missing members")
              observed = {"files": len(ordered), "bytes": total, "sha256": tree.hexdigest()}
              require(observed == expected and (manifest["file_count"], manifest["bytes"]) == (len(ordered), total)
                      and total < 1_000_000_000, f"{label}: whole-site digest, capacity or counts")
              return observed


          def main() -> None:
              cli = argparse.ArgumentParser(description=__doc__)
              cli.add_argument("--revision", required=True)
              cli.add_argument("--pins", type=Path, required=True)
              cli.add_argument("--local", type=Path, help="Verify the same files from a local archive directory")
              args = cli.parse_args()
              require(re.fullmatch(r"[0-9a-f]{40}", args.revision) is not None, "full Git revision required")
              pins = json.loads(args.pins.read_bytes())
              require(pins["source"] == SOURCE and pins["source_tree"] == SOURCE_TREE, "wrong qualification source")
              with tempfile.TemporaryDirectory() as tmp:
                  root = Path(tmp)
                  path = fetch(root, "receipt.json", args.revision, args.local)
                  require(binary_digest(path) == pins["receipt_sha256"], "qualification receipt hash mismatch")
                  receipt = json.loads(path.read_bytes())
                  require(receipt["schema"] == "lean-info-theory.release3-pages.v1" and receipt["purpose"] == "candidate"
                          and receipt["source"] == SOURCE and receipt["source_tree"] == SOURCE_TREE
                          and not receipt["rehearsal_overlays"] and set(receipt["sites"]) == {*SITES.values(), "LeanInfoTheory-API"}
                          and receipt["sites"]["LeanInfoTheory-API"] == HISTORICAL, "invalid three-site receipt")
                  results = {label: verify_site(label, site, pins["archives"][label], receipt["sites"][site], root,
                                                args.revision, args.local) for label, site in SITES.items()}
              print(json.dumps({"status": "PASS", "origin": "local" if args.local else "public-raw-github",
                                "source": SOURCE, "tree": SOURCE_TREE, "bundles_revision": args.revision,
                                "receipt_sha256": pins["receipt_sha256"], "verified_packages": results,
                                "preserved_v02_identity_in_receipt": HISTORICAL}, indent=2))


          if __name__ == "__main__":
              main()
          PYTHON
          python -B "$RUNNER_TEMP/check_bundles.py" --revision "$BUNDLES_REVISION" --pins "$RUNNER_TEMP/qualification.json"

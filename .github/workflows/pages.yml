name: Deploy website

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the validated artifact to GitHub Pages (requires explicit release approval)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  prepare:
    name: Build and validate Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check static release contract
        run: python scripts/validate_release.py static

      - name: Set up Lean and restore the mathlib cache
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: "false"
          build: "true"
          build-args: "-KwarningAsError=true"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"

      - name: Build and validate signature-bearing API documentation
        env:
          DOCGEN_SRC: github
        run: python scripts/validate_release.py api-docs

      - name: Assemble exact-commit Pages artifact
        run: python scripts/stage_website.py release

      - name: Validate publishable Pages artifact
        run: python scripts/check_website.py --site-root .lake/website-stage/LeanInfoTheory --mode publishable

      - name: Upload Pages artifact without deploying
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .lake/website-stage/LeanInfoTheory

  deploy:
    name: Deploy approved Pages artifact
    if: ${{ inputs.publish }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

name: Deploy a qualified LeanInfoTheory v0.3.0 site

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified archive to this repository's Pages site
        required: true
        type: boolean
        default: false
      rehearsed_tar_sha256:
        description: SHA-256 of the Pages TAR from the successful publication-off rehearsal (required to publish)
        required: false
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/compatibility/v0.3.0-promotion.json
            /docs/compatibility/v0.3.0-release-state.json
            /home_page/index.html
            /home_page/license.html
            /home_page/docs/research-projects.html
            /home_page/blueprint/index.html
            /home_page/roadmap.html
            /home_page/docs/figures/reuse-layers.svg
            /home_page/styles.css
            /scripts/compose_release3_citation_pages.py
      - name: Select the reviewed site and tooling revision
        id: select
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          test "$GITHUB_REPOSITORY" = serhatemrecoban/LeanInfoTheory
          test "$DEFAULT_BRANCH" = master
          site=main
          sha256sum --check --strict <<'PINS'
          099c686a50d3cfe1671328427917c6733dc4491ecf1eb37ac99c4ee014dbd12c  docs/compatibility/v0.3.0-promotion.json
          fba89f4e195c442d428fb597297bfbd9d3a6ea6ae23a2ca626a93f213d2c8aa0  docs/compatibility/v0.3.0-release-state.json
          19805759f198af7dadf8facc2acdee0478138b1d461fcb68d7e14ff59e98983e  scripts/compose_release3_citation_pages.py
          PINS
          source_sha=$(jq -er '.release_commit | select(test("^[a-f0-9]{40}$"))' docs/compatibility/v0.3.0-promotion.json)
          tag_sha=$(jq -er '.annotated_tag | select(test("^[a-f0-9]{40}$"))' docs/compatibility/v0.3.0-promotion.json)
          repo=serhatemrecoban/LeanInfoTheory
          gh api "repos/$repo/releases/tags/v0.3.0" | jq -e --arg sha "$source_sha" '.immutable == true and .draft == false and .prerelease == false and .tag_name == "v0.3.0" and .target_commitish == $sha' > /dev/null
          gh api "repos/$repo/git/ref/tags/v0.3.0" | jq -e --arg tag "$tag_sha" '.object.type == "tag" and .object.sha == $tag' > /dev/null
          gh api "repos/$repo/git/tags/$tag_sha" | jq -e --arg tag "$tag_sha" --arg sha "$source_sha" '.sha == $tag and .tag == "v0.3.0" and .object.type == "commit" and .object.sha == $sha' > /dev/null
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Read the release verifier at the reviewed source commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: serhatemrecoban/LeanInfoTheory
          ref: ${{ steps.select.outputs.source_sha }}
          path: verifier
          sparse-checkout: scripts
          persist-credentials: false
      - name: Verify the public tag, qualification receipt and archive
        env:
          SITE: ${{ steps.select.outputs.site }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=verifier/scripts python -B - <<'PY' > decision.json
          from http.client import HTTPSConnection
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit
          from check_release3_promotion import REPO_API, read_public, resolve
          from release_state import strict_json

          pins = strict_json(Path("docs/compatibility/v0.3.0-promotion.json").read_bytes())
          tag = pins["annotated_tag"]
          source = pins["release_commit"]
          authenticated = {f"{REPO_API}/{route}" for route in (
              "releases/tags/v0.3.0", "git/ref/tags/v0.3.0", f"git/tags/{tag}", f"git/commits/{source}"
          )}

          def read(url):
              if url not in authenticated:
                  return read_public(url)
              # This connection sends a credential only to the four exact GitHub endpoints and never follows redirects.
              conn = HTTPSConnection("api.github.com", timeout=60)
              try:
                  conn.request("GET", urlsplit(url).path, headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"], "User-Agent": "LeanInfoTheory-release-promotion"
                  })
                  response = conn.getresponse()
                  if response.status != 200:
                      raise RuntimeError(f"GitHub returned HTTP {response.status} for {url}")
                  return response.read()
              finally:
                  conn.close()

          print(json.dumps(resolve(os.environ["SITE"], pins, read=read), sort_keys=True))
          PY
          url=$(jq -er .bundle_url decision.json)
          curl --proto '=https' --fail --silent --show-error --location --retry 3 -o site.zip "$url"
          echo "$(jq -er .zip_sha256 decision.json)  site.zip" | sha256sum --check --strict
          test "$(unzip -Z1 site.zip)" = artifact.tar
          unzip -p site.zip artifact.tar > qualified.tar
          echo "$(jq -er .tar_sha256 decision.json)  qualified.tar" | sha256sum --check --strict
      - name: Add directory entries and compare the restored site to its qualified tree
        env:
          PUBLISH: ${{ inputs.publish }}
          REHEARSED_TAR_SHA256: ${{ inputs.rehearsed_tar_sha256 }}
        run: |
          set -euo pipefail
          umask 022
          mkdir site restored
          tar --extract --file qualified.tar --directory site
          PYTHONPATH=verifier/scripts python -P -B scripts/compose_release3_citation_pages.py \
            --site site --decision decision.json --commit "$GITHUB_SHA" > composition.json
          jq -c '.maintained_sha256' composition.json
          tar --format=gnu --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf artifact.tar -C site .
          tar --extract --file artifact.tar --directory restored
          diff --recursive --brief --no-dereference site restored
          PYTHONPATH=verifier/scripts python -B - <<'PY'
          import json
          from pathlib import Path
          from stage_website import tree_digest
          expected = json.loads(Path("composition.json").read_bytes())["site_tree_sha256"]
          root = Path("restored")
          tree, files, _, size = tree_digest(root)
          maximum = max(p.stat().st_size for p in root.rglob("*") if p.is_file())
          if size >= 1_000_000_000 or maximum > 100 * 1024**2:
              raise SystemExit("Restored Pages tree exceeds the hosting limits")
          print(f"Restored {files} files, {size} bytes, largest file {maximum} bytes, tree {tree}")
          if tree != expected:
              raise SystemExit("Restored Pages tree differs from the verified maintenance composition")
          PY
          tar_sha=$(sha256sum artifact.tar | cut -d' ' -f1)
          echo "Pages TAR SHA-256: $tar_sha"
          echo "Pages TAR SHA-256: $tar_sha" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PUBLISH" == true ]]; then
            [[ "$REHEARSED_TAR_SHA256" =~ ^[a-f0-9]{64}$ ]]
            test "$tar_sha" = "$REHEARSED_TAR_SHA256"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: artifact.tar
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: ${{ inputs.publish }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
